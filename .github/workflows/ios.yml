name: Build MiptRDP for iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          cmake --version
          python3 --version
          command -v pkg-config || brew install pkgconf
      - name: Validate sources
        run: python3 -m unittest discover -s tests -v
      - name: Build real iPhone app
        run: bash scripts/build.sh OS64 2>&1 | tee build.log
      - name: Upload IPA for local signing
        uses: actions/upload-artifact@v4
        with:
          name: MiptRDP-iPhone
          path: dist/*
          if-no-files-found: error
          retention-days: 3
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          retention-days: 3
          path: |
            build.log
            .build/device/CMakeFiles/CMakeConfigureLog.yaml
